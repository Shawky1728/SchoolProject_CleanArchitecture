<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Email</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">

    ```
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:40px 0;">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0"
                       style="background:#ffffff; border-radius:10px; overflow:hidden;">

                    <tr>
                        <td align="center"
                            style="background:#0d6efd; color:#ffffff; padding:25px;">
                            <h1 style="margin:0;">School Project</h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:40px; color:#333333;">

                            <h2 style="margin-top:0;">
                                Hello, {{UserName}}
                            </h2>

                            <p style="font-size:16px; line-height:1.6;">
                                Thank you for registering with
                                <strong>School Project</strong>.
                            </p>

                            <p style="font-size:16px; line-height:1.6;">
                                Please confirm your email address by clicking
                                the button below.
                            </p>

                            <div style="text-align:center; margin:35px 0;">

                                <a href="{{ConfirmationLink}}"
                                   style="
                                    background:#0d6efd;
                                    color:#ffffff;
                                    text-decoration:none;
                                    padding:14px 30px;
                                    border-radius:6px;
                                    font-size:16px;
                                    font-weight:bold;
                                    display:inline-block;">
                                    Confirm Email
                                </a>

                            </div>

                            <p style="font-size:14px; color:#666666;">
                                If you didn't create an account, you can safely
                                ignore this email.
                            </p>

                            <hr style="border:none; border-top:1px solid #eeeeee; margin:30px 0;">

                            <p style="font-size:13px; color:#999999; text-align:center;">
                                © 2026 School Project. All rights reserved.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
    ```

</body>
</html>
